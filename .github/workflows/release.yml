name: Fork Release

on:
  push:
    tags:
      - "dolphin-*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: dolphin-release-${{ github.ref }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:
  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        arch:
          - x64
          - arm64

    steps:
      - name: Check out Dolphin
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Install Ninja
        shell: powershell
        run: choco install ninja --yes --no-progress

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch == 'x64' && 'amd64' || 'amd64_arm64' }}

      - name: Configure
        shell: pwsh
        run: >
          cmake --preset ninja-release-${{ matrix.arch }}
          -DDOLPHIN_DEFAULT_UPDATE_TRACK=github
          -DDISTRIBUTOR=NVDEMU/dolphin

      - name: Build
        run: >
          cmake --build
          --preset ninja-build-release-${{ matrix.arch }}
          --parallel

      - name: Package
        shell: pwsh
        run: >
          7z a
          "${{ github.workspace }}\Dolphin-${{ env.RELEASE_TAG }}-Windows-${{ matrix.arch }}.7z"
          "${{ github.workspace }}\build\release\${{ matrix.arch }}\Binaries\*"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}
          path: Dolphin-${{ env.RELEASE_TAG }}-Windows-${{ matrix.arch }}.7z
          if-no-files-found: error

  macos:
    name: macOS Universal
    runs-on: macos-15-intel
    timeout-minutes: 120

    steps:
      - name: Check out Dolphin
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}
          submodules: recursive
          fetch-depth: 0

      - name: Check out universal Qt toolchain
        uses: actions/checkout@v4
        with:
          repository: dolphin-emu/ext-macos-qt
          ref: master
          path: qt
          fetch-depth: 1
          lfs: true

      - name: Install build tools
        run: brew install ninja ccache

      - name: Build universal app
        run: >
          python3 BuildMacOSUniversalBinary.py
          -G Ninja
          --ccache
          --arm64_qt5_path "${{ github.workspace }}/qt/latest/universal"
          --x86_64_qt5_path "${{ github.workspace }}/qt/latest/universal"
          --codesign -
          --distributor "NVDEMU/dolphin"

      - name: Package
        run: >
          ditto -c -k --sequesterRsrc --keepParent
          universal/Dolphin.app
          "Dolphin-${{ env.RELEASE_TAG }}-macOS-universal.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: Dolphin-${{ env.RELEASE_TAG }}-macOS-universal.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs:
      - windows
      - macos
    runs-on: ubuntu-latest

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*"
          path: release-assets
          merge-multiple: true

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if ! gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release create "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "Dolphin ${RELEASE_TAG}" \
              --generate-notes \
              --draft
          fi
          gh release upload "${RELEASE_TAG}" release-assets/* --repo "${GITHUB_REPOSITORY}" --clobber
          gh release edit "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" --draft=false
