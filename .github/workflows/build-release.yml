name: nvwii builds and releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  schedule:
    - cron: "30 4 * * *"

permissions:
  contents: write

concurrency:
  group: nvwii-builds-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_TYPE: Release

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Configure
        shell: pwsh
        run: cmake -S . -B Build -G "Visual Studio 17 2022" -A x64 -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_TESTS=OFF -DENABLE_ANALYTICS=OFF -DENABLE_AUTOUPDATE=OFF -DDISTRIBUTOR=nvwii
      - name: Build
        shell: pwsh
        run: cmake --build Build --config ${{ env.BUILD_TYPE }} --parallel
      - name: Package
        shell: pwsh
        run: Compress-Archive -Path Build/Binaries/* -DestinationPath nvwii-windows-x64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvwii-windows-x64
          path: nvwii-windows-x64.zip

  macos-arm64:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt
        run: brew install qt@6
      - name: Configure
        run: |
          export PATH="/opt/homebrew/opt/qt@6/bin:$PATH"
          cmake -S . -B Build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_TESTS=OFF -DENABLE_ANALYTICS=OFF -DENABLE_AUTOUPDATE=OFF -DDISTRIBUTOR=nvwii -DCMAKE_PREFIX_PATH="/opt/homebrew/opt/qt@6"
      - name: Build
        run: cmake --build Build --parallel
      - name: Package
        run: cd Build/Binaries && ditto -c -k --sequesterRsrc --keepParent *.app ../../nvwii-macos-arm64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvwii-macos-arm64
          path: nvwii-macos-arm64.zip

  macos-x86_64:
    name: macOS x86_64
    runs-on: macos-15-intel
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install Qt
        run: brew install qt@6
      - name: Configure
        run: |
          export PATH="/usr/local/opt/qt@6/bin:$PATH"
          cmake -S . -B Build -G Ninja -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DENABLE_TESTS=OFF -DENABLE_ANALYTICS=OFF -DENABLE_AUTOUPDATE=OFF -DDISTRIBUTOR=nvwii -DCMAKE_PREFIX_PATH="/usr/local/opt/qt@6"
      - name: Build
        run: cmake --build Build --parallel
      - name: Package
        run: cd Build/Binaries && ditto -c -k --sequesterRsrc --keepParent *.app ../../nvwii-macos-x86_64.zip
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nvwii-macos-x86_64
          path: nvwii-macos-x86_64.zip

  release:
    name: Publish release
    needs: [windows, macos-arm64, macos-x86_64]
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: nvwii-windows-x64
      - name: Download macOS arm64 artifact
        uses: actions/download-artifact@v4
        with:
          name: nvwii-macos-arm64
      - name: Download macOS x86_64 artifact
        uses: actions/download-artifact@v4
        with:
          name: nvwii-macos-x86_64
      - name: Publish nightly
        if: ${{ github.event_name == 'schedule' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: nvwii Nightly
          prerelease: true
          make_latest: false
          files: |
            nvwii-windows-x64.zip
            nvwii-macos-arm64.zip
            nvwii-macos-x86_64.zip
      - name: Publish tagged/manual release
        if: ${{ github.event_name != 'schedule' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: nvwii ${{ github.ref_name }}
          prerelease: false
          files: |
            nvwii-windows-x64.zip
            nvwii-macos-arm64.zip
            nvwii-macos-x86_64.zip
